          <div class="faq-item">
            <h3>Q. 입장료가 있나요?</h3>
            <p>대부분의 프로그램은 무료로 관람하실 수 있습니다. 일부 프로그램은 사전 신청이 필요할 수 있습니다.</p>
          </div>
          <div class="faq-item">
            <h3>Q. 주차는 가능한가요?</h3>
            <p>축제 기간 중 교통 통제가 예정되어 있으니 가급적 대중교통을 이용해 주세요.</p>
          </div>
          <div class="faq-item">
            <h3>Q. 우천 시에도 진행되나요?</h3>
            <p>기상 상황에 따라 일부 프로그램이 변경·취소될 수 있습니다. 공지사항을 확인해 주세요.</p>
          </div>
