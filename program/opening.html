<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개막식 &amp; 허준콘서트 | 제24회 허준축제</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body class="page">
    <div id="site-nav"></div>

    <div class="page-shell">
      <header class="page-head">
        <div class="page-head__text">
          <p class="page-head__badge">축제 프로그램</p>
          <h1 class="page-head__title">개막식 &amp; 허준콘서트</h1>
          <p class="page-head__crumb">
            <a href="../main.html">홈</a> &gt; 축제 프로그램 &gt; <span class="page-head__crumb-current">개막식 &amp; 허준콘서트</span>
          </p>
        </div>
        <img
          class="page-head__mascot"
          src="../img/sub-hujun.png"
          alt=""
          width="512"
          height="512"
        />
      </header>

      <div class="page-body">
        <div class="page-body__meta">
          <p>일시 : 2026년 10월 10일(토) 18:00~21:30</p>
          <p>장소 : 서울식물원 잔디마당 메인무대</p>
        </div>

        <div class="artist-grid">
          <figure class="artist-card">
            <img class="artist-card__img" src="../img/s-1.jpg" alt="안소미" width="400" height="533" />
            <figcaption class="artist-card__name">안소미</figcaption>
          </figure>
          <figure class="artist-card">
            <img class="artist-card__img" src="../img/s-2.jpg" alt="안성준" width="400" height="533" />
            <figcaption class="artist-card__name">안성준</figcaption>
          </figure>
          <figure class="artist-card">
            <img class="artist-card__img" src="../img/s-3.jpg" alt="벤" width="400" height="533" />
            <figcaption class="artist-card__name">벤</figcaption>
          </figure>
          <figure class="artist-card">
            <img class="artist-card__img" src="../img/s-4.jpg" alt="이펙스" width="400" height="533" />
            <figcaption class="artist-card__name">이펙스</figcaption>
          </figure>
          <figure class="artist-card">
            <img class="artist-card__img" src="../img/s-5.jpg" alt="멜로망스" width="400" height="533" />
            <figcaption class="artist-card__name">멜로망스</figcaption>
          </figure>
        </div>

        <h2 class="page-section-title">일정표</h2>
        <table class="schedule">
          <thead>
            <tr>
              <th scope="col">시간</th>
              <th scope="col">식순</th>
              <th scope="col">세부내용</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="schedule__time">18:00~18:30</td>
              <td class="schedule__order">오프닝</td>
              <td class="schedule__detail">사회자 오프닝</td>
            </tr>
            <tr>
              <td class="schedule__time">18:30~19:00</td>
              <td class="schedule__order">식전공연</td>
              <td class="schedule__detail"><span class="tag">안소미</span></td>
            </tr>
            <tr>
              <td class="schedule__time">19:00~19:20</td>
              <td class="schedule__order">개막선언 및 공식행사</td>
              <td class="schedule__detail">특별 영상 메시지, 개막 타고, 공식행사</td>
            </tr>
            <tr>
              <td class="schedule__time">19:20~19:30</td>
              <td class="schedule__order">개막 퍼포먼스</td>
              <td class="schedule__detail">개막 비전 퍼포먼스</td>
            </tr>
            <tr>
              <td class="schedule__time">19:30~21:30</td>
              <td class="schedule__order">허준 콘서트</td>
              <td class="schedule__detail">
                <span class="tag">안성준</span>
                <span class="tag">벤</span>
                <span class="tag">이펙스</span>
                <span class="tag">멜로망스</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="site-footer"></div>
    <script src="../js/site.js"></script>
  </body>
</html>
