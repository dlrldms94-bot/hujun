<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>허준 음악회 | 제24회 허준축제</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body class="page">
    <div id="site-nav"></div>

    <div class="page-shell">
      <header class="page-head">
        <div class="page-head__text">
          <p class="page-head__badge">축제 프로그램</p>
          <h1 class="page-head__title">허준 음악회</h1>
          <p class="page-head__crumb">
            <a href="../main.html">홈</a> &gt; 축제 프로그램 &gt;
            <span class="page-head__crumb-current">허준 음악회</span>
          </p>
        </div>
        <img
          class="page-head__mascot"
          src="../img/sub-hujun.png"
          alt=""
          width="512"
          height="512"
        />
      </header>

      <div class="page-body">
        <div class="page-body__meta">
          <p>일시 : 2026년 10월 11일(일) 18:00~20:00</p>
          <p>장소 : 서울식물원 잔디마당 메인무대</p>
        </div>

        <div class="feature-grid">
          <figure class="feature-card">
            <img
              class="feature-card__img"
              src="../img/Conductor.jpg"
              alt="지휘자 김동수"
              width="800"
              height="1000"
            />
            <figcaption class="feature-card__name">
              <span class="feature-card__role">지휘자</span> 김동수
            </figcaption>
          </figure>
          <figure class="feature-card">
            <img
              class="feature-card__img feature-card__img--wide"
              src="../img/orchestra.jpg"
              alt="41인조 뮤즈 윈드오케스트라"
              width="1200"
              height="800"
            />
            <figcaption class="feature-card__name">
              41인조 뮤즈 윈드오케스트라
            </figcaption>
          </figure>
        </div>

        <h2 class="page-section-title">일정표</h2>
        <table class="schedule">
          <thead>
            <tr>
              <th scope="col">시간</th>
              <th scope="col">식순</th>
              <th scope="col">세부내용</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="schedule__time">18:00~18:05</td>
              <td class="schedule__order">오프닝</td>
              <td class="schedule__detail">사회자 오프닝</td>
            </tr>
            <tr>
              <td class="schedule__time">18:05~18:20</td>
              <td class="schedule__order">폐막식</td>
              <td class="schedule__detail">폐막 공식행사</td>
            </tr>
            <tr>
              <td class="schedule__time">18:20~19:55</td>
              <td class="schedule__order">허준 음악회</td>
              <td class="schedule__detail">41인조 윈드오케스트라</td>
            </tr>
            <tr>
              <td class="schedule__time">19:55~20:00</td>
              <td class="schedule__order">엔딩</td>
              <td class="schedule__detail">클로징</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="site-footer"></div>
    <script src="../js/site.js"></script>
  </body>
</html>
